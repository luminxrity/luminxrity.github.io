<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes stats Spotify</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#14123a;--card:#1e1b52;--txt:#ece8ff;--mute:#a49fd6;--pink:#ff4f9a;--sun:#ffd23f}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--txt);font:400 16px/1.5 'DM Sans',system-ui,sans-serif;padding:24px 16px 64px}
main{max-width:960px;margin:0 auto}
h1,h2,.big{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;line-height:1}
h2{font-size:1.5rem;margin:40px 0 16px}
.center{text-align:center;padding-top:15vh}
.center h1{font-size:clamp(2.5rem,9vw,5rem);margin-bottom:16px}
.center p{color:var(--mute);margin-bottom:24px}
input{background:var(--card);border:2px solid #3a3680;color:var(--txt);padding:12px 14px;border-radius:10px;width:min(100%,380px);font:inherit;margin-bottom:12px}
button{background:var(--pink);color:#14123a;border:0;padding:12px 22px;border-radius:99px;font:600 1rem 'DM Sans',sans-serif;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.ghost{background:transparent;color:var(--txt);border:2px solid #3a3680}
.ghost[aria-pressed=true]{background:var(--sun);color:#14123a;border-color:var(--sun)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:24px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.user{display:flex;align-items:center;gap:10px;color:var(--mute)}
.user img{width:36px;height:36px;border-radius:50%}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media(max-width:700px){.hero{grid-template-columns:1fr}}
.hero>div{background:var(--card);border-radius:20px;overflow:hidden;position:relative;min-height:300px;display:flex;align-items:flex-end}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .cap{position:relative;padding:60px 20px 20px;width:100%;background:linear-gradient(transparent,rgba(20,18,58,.95))}
.cap small{color:var(--sun);font-weight:600}
.big{font-size:clamp(1.8rem,5vw,2.8rem);display:block;margin-top:4px;overflow-wrap:anywhere}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.num{background:var(--card);border-radius:16px;padding:18px}
.num b{font:800 2.2rem 'Bricolage Grotesque',sans-serif;color:var(--sun);display:block}
.num span{color:var(--mute);font-size:.9rem}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}
ol{list-style:none;padding:0}
li.row{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid #2c2970}
li.row img{width:48px;height:48px;border-radius:8px;object-fit:cover;flex:none;background:var(--card)}
li.row .t{min-width:0}
.t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t .s{color:var(--mute);font-size:.9rem}
.rk{width:1.6rem;flex:none;color:var(--pink);font-weight:600;text-align:right}
.g{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;align-items:center}
.g i{display:block;height:14px;background:var(--pink);border-radius:7px}
.note{color:var(--mute);font-size:.85rem;margin-top:32px;max-width:70ch}
.err{color:var(--pink);margin-top:16px}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* ====== CONFIG : colle ici ton Client ID Spotify (ou saisis-le dans la page) ====== */
const CLIENT_ID_DEFAULT = "";
/* ================================================================================== */
const SCOPES = "user-top-read user-read-recently-played";
const REDIRECT = location.origin + location.pathname;
const $app = document.getElementById("app");
const store = {
  get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},
  set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},
  del:k=>{try{localStorage.removeItem(k)}catch(e){}}
};
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clientId = () => CLIENT_ID_DEFAULT || store.get("sp_cid") || "";

/* ---------- Auth PKCE ---------- */
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
async function login(){
  const cid = CLIENT_ID_DEFAULT || document.getElementById("cid")?.value.trim();
  if(!cid){ return showLogin("Renseigne ton Client ID Spotify."); }
  store.set("sp_cid", cid);
  const verifier = b64(crypto.getRandomValues(new Uint8Array(48)));
  store.set("sp_verifier", verifier);
  const challenge = b64(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  const p = new URLSearchParams({client_id:cid,response_type:"code",redirect_uri:REDIRECT,scope:SCOPES,code_challenge_method:"S256",code_challenge:challenge});
  location.href = "https://accounts.spotify.com/authorize?" + p;
}
async function tokenRequest(body){
  const r = await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams(body)});
  if(!r.ok) throw new Error("Connexion refusée par Spotify");
  const d = await r.json();
  store.set("sp_token", d.access_token);
  store.set("sp_exp", Date.now() + d.expires_in*1000 - 60000);
  if(d.refresh_token) store.set("sp_refresh", d.refresh_token);
}
async function getToken(){
  const code = new URLSearchParams(location.search).get("code");
  if(code){
    await tokenRequest({client_id:clientId(),grant_type:"authorization_code",code,redirect_uri:REDIRECT,code_verifier:store.get("sp_verifier")||""});
    history.replaceState({}, "", REDIRECT);
  }
  if(store.get("sp_token") && Date.now() < +store.get("sp_exp")) return store.get("sp_token");
  if(store.get("sp_refresh")){
    await tokenRequest({client_id:clientId(),grant_type:"refresh_token",refresh_token:store.get("sp_refresh")});
    return store.get("sp_token");
  }
  return null;
}
function logout(){ ["sp_token","sp_exp","sp_refresh","sp_verifier"].forEach(store.del); showLogin(); }
async function api(path){
  const r = await fetch("https://api.spotify.com/v1"+path,{headers:{Authorization:"Bearer "+store.get("sp_token")}});
  if(r.status===401){ logout(); throw new Error("Session expirée"); }
  if(!r.ok) throw new Error("Erreur Spotify ("+r.status+")");
  return r.json();
}

/* ---------- Vues ---------- */
function showLogin(err){
  $app.innerHTML = `<section class="center">
    <h1>Ce que tu écoutes vraiment</h1>
    <p>Connecte ton compte Spotify pour voir tes artistes, titres et genres les plus écoutés.</p>
    ${CLIENT_ID_DEFAULT?"":`<input id="cid" placeholder="Client ID Spotify" value="${esc(clientId())}" aria-label="Client ID Spotify"><br>`}
    <button id="go">Se connecter avec Spotify</button>
    <p class="note" style="margin:24px auto 0">Redirect URI à enregistrer à l'identique dans ton dashboard Spotify :<br><code style="color:var(--sun);user-select:all;overflow-wrap:anywhere">${esc(REDIRECT)}</code></p>
    ${err?`<p class="err">${esc(err)}</p>`:""}
  </section>`;
  document.getElementById("go").onclick = login;
}

const RANGES = [["short_term","4 dernières semaines"],["medium_term","6 derniers mois"],["long_term","Depuis toujours"]];
let range = "medium_term", me = null;

async function render(){
  $app.innerHTML = `<p class="note">Chargement…</p>`;
  try{
    if(!me) me = await api("/me");
    const [ta,tt,rp] = await Promise.all([
      api(`/me/top/artists?limit=50&time_range=${range}`),
      api(`/me/top/tracks?limit=50&time_range=${range}`),
      api(`/me/player/recently-played?limit=50`)
    ]);
    draw(ta.items, tt.items, rp.items);
  }catch(e){ $app.innerHTML = `<p class="err">${esc(e.message)}</p><p class="note"><button id="lo">Se reconnecter</button></p>`; document.getElementById("lo").onclick = logout; }
}

const img = o => (o.images||o.album?.images||[])[1]?.url || (o.images||o.album?.images||[])[0]?.url || "";
const row = (i,n,a,b) => `<li class="row"><span class="rk">${i+1}</span><img src="${esc(a)}" alt="" loading="lazy"><div class="t"><div>${esc(n)}</div><div class="s">${esc(b)}</div></div></li>`;

function draw(artists, tracks, recent){
  // genres
  const gc = {};
  artists.forEach(a=>(a.genres||[]).forEach(g=>gc[g]=(gc[g]||0)+1));
  const genres = Object.entries(gc).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const gmax = genres[0]?.[1] || 1;
  // stats récentes (50 derniers titres)
  const ms = recent.reduce((s,r)=>s+r.track.duration_ms,0);
  const h = Math.floor(ms/3600000), m = Math.round(ms%3600000/60000);
  const rc = {}; recent.forEach(r=>rc[r.track.id]=(rc[r.track.id]||0)+1);
  const topRecentId = Object.entries(rc).sort((a,b)=>b[1]-a[1])[0];
  const topRecent = topRecentId && recent.find(r=>r.track.id===topRecentId[0]).track;
  const withPop = tracks.filter(t=>typeof t.popularity==='number');
  const pop = withPop.length ? Math.round(withPop.reduce((s,t)=>s+t.popularity,0)/withPop.length) : null;
  const explicit = tracks.length ? Math.round(100*tracks.filter(t=>t.explicit).length/tracks.length) : 0;
  const uniqArtists = new Set(recent.map(r=>r.track.artists[0].id)).size;
  const a0 = artists[0], t0 = tracks[0];

  $app.innerHTML = `
  <div class="bar">
    <div class="tabs" role="group" aria-label="Période">${RANGES.map(([k,l])=>`<button class="ghost" data-r="${k}" aria-pressed="${k===range}">${l}</button>`).join("")}</div>
    <div class="user">${me.images?.[0]?`<img src="${esc(me.images[0].url)}" alt="">`:""}<span>${esc(me.display_name||me.id)}</span><button class="ghost" id="lo">Déconnexion</button></div>
  </div>
  ${a0&&t0?`<div class="hero">
    <div><img src="${esc(img(a0))}" alt=""><div class="cap"><small>Artiste n°1</small><span class="big">${esc(a0.name)}</span></div></div>
    <div><img src="${esc(img(t0))}" alt=""><div class="cap"><small>Titre n°1</small><span class="big">${esc(t0.name)}</span><span>${esc(t0.artists.map(a=>a.name).join(", "))}</span></div></div>
  </div>`:`<p class="note">Pas assez de données sur cette période.</p>`}
  <h2>Tes 50 dernières écoutes</h2>
  <div class="nums">
    <div class="num"><b>${h} h ${m} min</b><span>de musique écoutée sur ces 50 titres</span></div>
    <div class="num"><b>${uniqArtists}</b><span>artistes différents</span></div>
    <div class="num"><b>${topRecent?esc(topRecent.name):"–"}</b><span>titre le plus rejoué${topRecentId&&topRecentId[1]>1?` (${topRecentId[1]} fois)`:""}</span></div>
    ${pop!==null?`<div class="num"><b>${pop}/100</b><span>popularité moyenne de tes top titres</span></div>`:""}
    <div class="num"><b>${explicit} %</b><span>de titres explicites dans ton top</span></div>
  </div>
  <div class="cols">
    <section><h2>Top artistes</h2><ol>${artists.slice(0,10).map((a,i)=>row(i,a.name,img(a),(a.genres&&a.genres[0])||"")).join("")}</ol></section>
    <section><h2>Top titres</h2><ol>${tracks.slice(0,10).map((t,i)=>row(i,t.name,img(t),t.artists[0].name)).join("")}</ol></section>
  </div>
  ${genres.length?`<h2>Genres favoris</h2>
  <div class="g">${genres.map(([g,n])=>`<span>${esc(g)}</span><i style="width:${Math.max(6,100*n/gmax)}%"></i>`).join("")}</div>`:""}
  <p class="note">Spotify ne donne pas le temps d'écoute total via son API : le temps affiché porte sur tes 50 derniers titres. Pour le total sur toute ta vie, demande ton « historique de streaming étendu » dans les paramètres de confidentialité de ton compte.</p>`;
  document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{range=b.dataset.r;render();});
  document.getElementById("lo").onclick = logout;
}

/* ---------- Démarrage ---------- */
(async()=>{
  const p = new URLSearchParams(location.search);
  if(p.get("error")) return showLogin("Autorisation refusée : " + p.get("error"));
  try{
    const t = await getToken();
    t ? render() : showLogin();
  }catch(e){ showLogin(e.message); }
})();
</script>
</body>
</html>
